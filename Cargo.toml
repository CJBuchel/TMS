[workspace]
resolver = "3"
members = [
  "crates/tms-core",
  "crates/tms-db",
  "crates/tms-schedule",
  "crates/tms-seasons",
  "crates/tms-server",
  "crates/tms-launcher",
  "crates/tms-client",
  "crates/tms-ui",
]
default-members = [
  "crates/tms-core",
  "crates/tms-db",
  "crates/tms-schedule",
  "crates/tms-seasons",
  "crates/tms-server",
  "crates/tms-launcher",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
tms-core = { path = "crates/tms-core" }
tms-db = { path = "crates/tms-db" }
tms-schedule = { path = "crates/tms-schedule" }
tms-seasons = { path = "crates/tms-seasons" }
tms-server = { path = "crates/tms-server" }
tms-ui = { path = "crates/tms-ui" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
thiserror = "2"
schemars = { version = "1", features = ["uuid1", "chrono04"] }

[profile.release]
opt-level = 3
lto = "thin"

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
debug = false
incremental = false

[workspace.lints.rust]
# Denied everywhere; the one exception is the Windows console attach in tms-launcher main.rs.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
uninlined_format_args = "allow"
doc_markdown = "allow"
default_trait_access = "allow"
too_many_lines = "allow"
