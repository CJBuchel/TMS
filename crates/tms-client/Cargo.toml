[package]
name = "tms-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tms-core.workspace = true
tms-ui.workspace = true
tms-seasons.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono = { workspace = true, features = ["wasmbind"] }
uuid = { workspace = true, features = ["js"] }

dioxus = { version = "0.7.10", features = ["web", "router"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
futures = "0.3"
gloo-net = { version = "0.7", default-features = false, features = ["http", "json", "websocket"] }
gloo-timers = { version = "0.4", features = ["futures"] }
gloo-storage = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "Location", "EventTarget", "VisibilityState", "Blob", "BlobPropertyBag", "Url"] }

[lints]
workspace = true
