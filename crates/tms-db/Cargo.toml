[package]
name = "tms-db"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["embedded"]
# Bundles PostgreSQL into the binary. Without it only `--database-url` works.
embedded = ["dep:postgresql_embedded"]

[dependencies]
anyhow = "1"
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
zip = { version = "9", default-features = false, features = ["deflate"] }
rand = "0.9"
tokio = { version = "1", features = ["fs", "sync", "time", "process", "rt"] }
tracing = "0.1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate"] }
postgresql_embedded = { version = "0.22", default-features = false, features = ["bundled", "tokio", "tls-rustls-ring"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
serde_json.workspace = true
zip = { version = "9", default-features = false, features = ["deflate"] }

[lints]
workspace = true
