[package]
name = "tms-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["print"]
# Printable PDFs (Typst). Off for quicker development builds: `--no-default-features`.
print = ["dep:typst-as-lib", "dep:typst", "dep:typst-pdf"]

[dependencies]
tms-core = { workspace = true, features = ["sqlx"] }
tms-schedule.workspace = true
tms-seasons.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
thiserror.workspace = true

anyhow = "1"
axum = { version = "0.8", features = ["ws", "macros"] }
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7", features = ["fs", "trace", "set-header"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "macros", "migrate", "json"] }
tracing = "0.1"
argon2 = { version = "0.5", features = ["std"] }
sha2 = "0.10"
hex = "0.4"
rand = "0.9"
chrono-tz = "0.10"
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
typst-as-lib = { version = "0.17", optional = true }
typst = { version = "0.15", optional = true }
typst-pdf = { version = "0.15", optional = true }

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
tokio-tungstenite = "0.29"
# Integration tests run against a real embedded PostgreSQL, one per test.
tms-db = { workspace = true, features = ["embedded"] }
# The API schema files in docs/ are regenerated by a test.
tms-core = { workspace = true, features = ["sqlx", "schema"] }
schemars.workspace = true

[lints]
workspace = true
